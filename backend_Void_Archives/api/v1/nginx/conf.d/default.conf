server {
    listen 3000;
    server_name localhost;
    client_max_body_size 25M;

    # DNS interno de Docker: evita error 502 cuando se recrean contenedores
    resolver 127.0.0.11 valid=5s ipv6=off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"Void Archives NGINX API Gateway"}';
    }

    location /articulos {
        set $articulos_upstream http://articulos:3001;
        proxy_pass $articulos_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location /auth {
        set $auth_upstream http://usuarios:3002;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location /comentarios {
        set $comentarios_upstream http://comentarios:3004;
        proxy_pass $comentarios_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
